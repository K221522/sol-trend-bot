<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOL Trend Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #0b0e14;
      color: #f3f4f6;
    }
    .card {
      background: #141923;
      border: 1px solid #242c3d;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    .sub { color: #9ca3af; font-size: 13px; margin-bottom: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .start { background: #16a34a; color: white; }
    .stop { background: #dc2626; color: white; }
    .refresh { background: #2563eb; color: white; }
    select {
      background: #0b0e14;
      color: #f3f4f6;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat-box {
      background: #0e131b;
      border: 1px solid #1e2636;
      border-radius: 10px;
      padding: 12px;
    }
    .label { color: #9ca3af; font-size: 12px; }
    .val { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .logs {
      background: #090c11;
      border: 1px solid #1e2636;
      border-radius: 10px;
      padding: 12px;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .on { background: rgba(22, 163, 74, 0.2); color: #4ade80; }
    .off { background: rgba(220, 38, 38, 0.2); color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SOL Trend Bot</h1>
    <div class="sub">Paper-trade dashboard connected to Railway</div>
    <span id="statusPill" class="pill off">STOPPED</span>
    <div class="row">
      <button class="start" onclick="sendAction('/api/start')">Start Bot</button>
      <button class="stop" onclick="sendAction('/api/stop')">Stop Bot</button>
      <button class="refresh" onclick="loadState()">Refresh</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-top: 0;">
      <div>
        <div class="label">Strategy</div>
        <select id="strategySelect" onchange="updateSettings()">
          <option value="Breakout">Breakout</option>
          <option value="Momentum">Momentum</option>
        </select>
      </div>
      <div>
        <div class="label">Risk Level</div>
        <select id="riskSelect" onchange="updateSettings()">
          <option value="Conservative">Conservative</option>
          <option value="Balanced">Balanced</option>
          <option value="Aggressive">Aggressive</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat-box">
        <div class="label">Paper Balance</div>
        <div class="val" id="balanceVal">1.0 SOL</div>
      </div>
      <div class="stat-box">
        <div class="label">Latest Solana Slot</div>
        <div class="val" id="slotVal">-</div>
      </div>
      <div class="stat-box">
        <div class="label">Paper Mode</div>
        <div class="val" id="paperVal">true</div>
      </div>
      <div class="stat-box">
        <div class="label">Open Positions</div>
        <div class="val" id="posVal">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom: 8px;">Live Logs</div>
    <div class="logs" id="logsBox">Loading...</div>
  </div>

  <script>
    const API_BASE = "https://sol-trend-bot-production.up.railway.app";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    async function loadState() {
      try {
        const res = await fetch(`${API_BASE}/api/state`);
        const data = await res.json();

        const pill = document.getElementById("statusPill");
        if (data.running) {
          pill.textContent = "RUNNING";
          pill.className = "pill on";
        } else {
          pill.textContent = "STOPPED";
          pill.className = "pill off";
        }

        document.getElementById("balanceVal").textContent = `${data.paper_balance_sol ?? 1.0} SOL`;
        document.getElementById("slotVal").textContent = data.last_slot ?? "-";
        document.getElementById("paperVal").textContent = String(data.paper_trade ?? true);
        document.getElementById("posVal").textContent = String((data.open_positions || []).length);

        if (data.strategy) document.getElementById("strategySelect").value = data.strategy;
        if (data.risk_level) document.getElementById("riskSelect").value = data.risk_level;

        const logs = data.logs || [];
        document.getElementById("logsBox").innerHTML = logs.length
          ? logs.slice().reverse().map(line => `<div>${escapeHtml(line)}</div>`).join("")
          : "<div>No logs yet.</div>";
      } catch (err) {
        document.getElementById("logsBox").innerHTML = `<div>Error connecting to backend: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function sendAction(path) {
      try {
        await fetch(`${API_BASE}${path}`, { method: "POST" });
        await loadState();
      } catch (err) {
        alert("Action failed: " + err.message);
      }
    }

    async function updateSettings() {
      const payload = {
        strategy: document.getElementById("strategySelect").value,
        risk_level: document.getElementById("riskSelect").value
      };
      try {
        await fetch(`${API_BASE}/api/settings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        await loadState();
      } catch (err) {
        alert("Settings update failed: " + err.message);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadState();
    setInterval(loadState, 5000);
  </script>
</body>
</html>
